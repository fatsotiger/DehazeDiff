#### general settings
name: latent-reffusion-dehazing
use_tb_logger: true
model: latent_denoising
distortion: dehazing
gpu_ids: [0]

sde:
  max_sigma: 50 # 50
  T: 100
  sample_T: 100
  schedule: cosine # linear, cosine
  eps: 0.005

degradation: # for some synthetic dataset that only have GTs
  # for denoising
  sigma: 50 # 25
  noise_type: G # Gaussian noise: G

  # for super-resolution
  scale: 4
  
#### datasets
datasets:
  train:
    name: Train_Dataset
    mode: LQGT
    dataroot_GT: D:\Data\NH-HAZE\GT
    dataroot_LQ: D:\Data\NH-HAZE\hazy

    use_shuffle: true
    n_workers: 1  # per GPU
    batch_size: 2
    GT_size: 1024 # 1024
    LR_size: 1024 # 1024
    use_flip: false
    use_rot: false
    use_swap: false
    color: RGB
  val:
    name: Val_Dataset
    mode: LQGT
    dataroot_GT: D:\Data\NH-HAZE\VGT
    dataroot_LQ: D:\Data\NH-HAZE\Vhazy

#### network structures
network_G:
  which_model: ConditionalNAFNet
  setting:
    img_channel: 16
    width: 64
    enc_blk_nums: [1, 1, 1, 28]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]

network_L:
  which_model: UNet
  setting:
    in_ch: 3
    out_ch: 3
    ch: 16
    ch_mult: [4, 8, 8, 16]
    embed_dim: 8

#### path
path:
  pretrain_model_G:   D:\Diffusion_way\image-restoration-sde-main\image-restoration-sde-main\experiments\lastest_EMA.pth # 'D:\Diffusion_way\image-restoration-sde-main\image-restoration-sde-main\experiments\140000_G.pth'
  strict_load: true
  resume_state:  # D:\\Diffusion_way\\image-restoration-sde-main\\image-restoration-sde-main\\experiments\\320000.state #'D:\Diffusion_way\image-restoration-sde-main\image-restoration-sde-main\experiments\latent-dehazing\latent-reffusion-dehazing'
  pretrain_model_L: pretrained_models/epochBest_MD_modelNH.pkl

#### training settings: learning rate scheme, loss
train:
  optimizer: Adam #Lion
  lr_G: !!float 3e-5
  lr_scheme: TrueCosineAnnealingLR
  beta1: 0.9
  beta2: 0.99
  niter: 400000
  warmup_iter: -1  # no warm up
  lr_steps: [10000, 12000, 15000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # criterion
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0
  val_freq: 1

#### logger
logger:
  print_freq: 500
  save_checkpoint_freq: 5000
